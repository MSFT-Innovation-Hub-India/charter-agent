# Foundry hosted-agent deployment manifest. Schema per
# https://github.com/microsoft-foundry/foundry-samples/tree/main/samples/python/hosted-agents/agent-framework
#
# `azd deploy` packages this directory as a container image and registers it
# with the Foundry Agent Service using this manifest. Foundry auto-injects
# FOUNDRY_PROJECT_ENDPOINT, AZURE_AI_MODEL_DEPLOYMENT_NAME (resolved against
# the model resource named below), and APPLICATIONINSIGHTS_CONNECTION_STRING.
kind: hosted
name: charter-agent
protocols:
  - protocol: responses
    version: 1.0.0
resources:
  cpu: "0.5"
  memory: 1Gi
environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  - name: TOOLBOX_NAME
    value: "Charter-Agent-Tools"