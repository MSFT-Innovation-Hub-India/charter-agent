apiVersion: foundry.azure.com/v1
kind: HostedAgent
metadata:
  name: charter-agent
spec:
  protocol: invocations
  runtime:
    image: charter-agent:latest
    platform: linux/amd64
  env:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: gpt-5
    - name: FOUNDRY_PROJECT_ENDPOINT
      value: https://ocvp-agent-svc-resource.services.ai.azure.com/api/projects/ocvp-agent-svc
    - name: TOOLBOX_NAME
      value: Charter-Agent-Tools
    # TOOLBOX_VERSION pin for dev only — omit in prod to use the consumer endpoint.
    # - name: TOOLBOX_VERSION
    #   value: "1"
    # Phase 1.5+ (uncomment as modules land):
    # - name: GITHUB_TOKEN
    #   valueFrom: { keyVault: { secret: charter-agent-github-pat } }
    # - name: COORDINATOR_OBO_TENANT_ID
    #   valueFrom: { keyVault: { secret: coordinator-obo-tenant-id } }
    # - name: COORDINATOR_OBO_CLIENT_ID
    #   valueFrom: { keyVault: { secret: coordinator-obo-client-id } }
    # - name: COORDINATOR_OBO_CLIENT_SECRET
    #   valueFrom: { keyVault: { secret: coordinator-obo-client-secret } }
